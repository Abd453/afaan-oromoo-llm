<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afaan Oromoo AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-box { height: 70vh; overflow-y: auto; }
        .user-msg { background: #dcf8c6; align-self: flex-end; }
        .bot-msg { background: #f0f0f0; align-self: flex-start; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-2xl mx-auto mt-10 bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="bg-blue-600 p-4 text-white text-center font-bold text-xl">
            Afaan Oromoo AI 
        </div>
        
        <div id="chat-container" class="chat-box p-4 flex flex-col gap-3">
            <div class="bot-msg p-3 rounded-lg max-w-[80%]">Akkam ree! Maal isiniif yoon godhu danda'a?</div>
        </div>

        <div class="p-4 border-t flex gap-2">
            <input type="text" id="user-input" placeholder="Gaaffii keessan asitti barreessaa..." 
                   class="flex-1 border p-2 rounded-lg outline-none focus:border-blue-500">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Ergi</button>
        </div>
    </div>

    <script>
        let chatHistory = []; // Stores the conversation context

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = inputField.value.trim();
            if (!text) return;

            // 1. Show User Message
            appendMessage(text, 'user-msg');
            inputField.value = '';

            try {
                // 2. Call FastAPI
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: text, history: chatHistory })
                });
                
                const data = await response.json();
                
                // 3. Update History & Show Bot Message
                appendMessage(data.response, 'bot-msg');
                
                // Keep Gemini history format
                chatHistory.push({"role": "user", "parts": [text]});
                chatHistory.push({"role": "model", "parts": [data.response]});

            } catch (error) {
                appendMessage("Dogoggora: VPN keessan check godhaa.", 'bot-msg text-red-500');
            }
        }

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `${className} p-3 rounded-lg max-w-[80%]`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
